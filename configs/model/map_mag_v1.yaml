# Frozen MAP-MAG v1 config and code snapshot.
#
# Use with:
#   python src/main.py model=map_mag_v1 ...
#
# Keep name=map_mag_v1 so the model factory imports src.models.map_mag_v1.
# This freezes both the v1 hyperparameter surface and implementation behavior.
name: map_mag_v1
version: map_mag_v1

hidden_dim: 256
dropout: 0.2
norm: layernorm

# Structure-aware diffusion path.
num_hops: 3
# Keep NeighborLoader sampling depth aligned with MAP-MAG diffusion depth.
num_layers: ${model.num_hops}
restart: 0.15
diffusion_add_self_loops: true

# Semantic prototype path.
num_prototypes: 16
lambda_proto: 0.1

# Router and reliability controls.
use_reliability: true
reliability_min: 0.1
reliability_mode: double
router_temperature: 3.0
lambda_gate: 0.01
use_gate_loss: true
gate_warmup_epochs: 10

# Frequency gate controls.
gamma_min: 0.05
gamma_max: 0.95
gamma_temperature: 3.0
gamma_warmup_epochs: 10
fixed_gamma: null

# Path fusion. weighted_sum is the frozen v1 default; concat_mlp is a light
# ablation that learns interactions between weighted path embeddings.
fusion_type: weighted_sum

# Node-level analysis export. Writes best-val and final-epoch CSV files.
export_node_aux: true

# Optional prototype semantic analysis export. Disabled by default because it
# adds extra best/final inference passes for classification diagnostics.
export_prototype_aux: false
prototype_export_topk: 3

# Ablation switches.
use_self_path: true
use_structure_path: true
use_prototype_path: true
use_preference_router: true
structure_low_pass_only: false
self_only: false

# MAP-MAG v1 uses full-graph training by default so diffusion uses the full
# message graph rather than repeated propagation inside sampled subgraphs.
full_graph_training: true

name: nc

epochs: 150
lr: 5e-4
weight_decay: 1e-5
batch_size: 1024
num_neighbors: 15
inference_mode: full
inference_batch_size: 4096
eval_every: 1
patience: 20
max_train_batches: null

loss:
  aux_weight: 1.0

# Optional best-checkpoint test-time modality masking diagnostics.
eval_modality_masks:
  enabled: false
  modes:
    - mask_text
    - mask_visual
    - mask_both_partial
  partial_ratio: 0.5
  partial_seed_offset: 100000

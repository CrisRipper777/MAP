name: lp
protocol_version: unified_sampled_lp_v1

# Unified 0901/RPTA-style sampled LP protocol. Graph encoders always use
# LinkNeighborLoader; only MLP uses edge-label mini-batches.
training_mode: sampled
optimizer: adam

epochs: 150
lr: 1e-3
weight_decay: 1e-5
# Patience is counted in validation events, not epochs.
patience: 10
early_stop_min_epoch: 20
early_stop_min_delta: 1e-4
grad_clip: 1.0
batch_size: 2048
num_neighbors: [5, 5]
subgraph_type: bidirectional
num_train_neg: 1
# Remove batch-positive message edges on CPU through LinkNeighborLoader's
# global e_id mapping. local_keys is retained only for equivalence audits.
positive_edge_mask_backend: global_eid

loader_num_workers: 4
loader_prefetch_factor: 2
torch_threads: 8
# Independent deterministic random streams are derived from run_seed using
# these offsets for train negatives, batch shuffle and neighbor sampling.
negative_seed_offset: 10000
shuffle_seed_offset: 20000
neighbor_seed_offset: 30000

inference_mode: full # 'full' or 'layerwise'
inference_batch_size: 4096
eval_preload_node_emb: true
eval_every: 2
# 限制每个 epoch 实际训练多少个 mini-batch，null 表示不限制
max_train_batches: null 
# null = use all positives; int = sample this many per epoch
# 限制每个 epoch 一开始采样多少条训练正边
train_pos_per_epoch: null  
eval_edge_batch_size: 512

loss:
  aux_weight: 1.0

decoder:
  name: mlp
  hidden_dim: 256
  num_layers: 3
  dropout: 0.02
  # Shared LP embedding dimension across encoders.
  proj_dim: 128

save_ckpt_path: null
evaluate_test: true

# Optional best-checkpoint test-time modality masking diagnostics.
eval_modality_masks:
  enabled: false
  modes:
    - mask_text
    - mask_visual
    - mask_both_partial
  partial_ratio: 0.5
  partial_seed_offset: 100000
